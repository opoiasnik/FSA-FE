<section class="viewings">
  <header class="viewings__head">
    <div class="ra-eyebrow">Your activity</div>
    <h1>Viewing requests</h1>
    <p>Track requests you've sent to property owners.</p>
  </header>

  <p-message *ngIf="error()" severity="warn" [text]="error() || ''"></p-message>

  <div *ngIf="loading()" class="skeleton-rows">
    <p-skeleton *ngFor="let _ of [1,2,3]" width="100%" height="80px"></p-skeleton>
  </div>

  <ul *ngIf="!loading()" class="viewings__list">
    <li *ngFor="let v of items()" class="ra-card viewing">
      <div class="viewing__main" (click)="open(v.listing.id)">
        <h3>{{ v.listing.title }}</h3>
        <p class="viewing__city">{{ v.listing.city }}</p>
        <p class="viewing__date"><i class="pi pi-calendar"></i> {{ v.requestedDate | date:'medium' }}</p>
        <p *ngIf="v.note" class="viewing__note">{{ v.note }}</p>
      </div>
      <div class="viewing__side">
        <span class="ra-pill"
              [class.ra-pill--success]="v.status === 'APPROVED'"
              [class.ra-pill--danger]="v.status === 'REJECTED' || v.status === 'CANCELLED'">
          {{ v.status }}
        </span>
        <button *ngIf="v.status === 'PENDING' || v.status === 'APPROVED'"
                type="button" class="ra-btn ra-btn--ghost ra-btn--sm" (click)="cancel(v.id)">
          Cancel
        </button>
      </div>
    </li>

    <li *ngIf="!items().length" class="viewings__empty">
      You haven't requested any viewings yet.
    </li>
  </ul>
</section>
