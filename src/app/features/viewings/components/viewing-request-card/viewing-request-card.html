<article class="ra-card viewing">
  <div class="viewing__main" (click)="open()">
    <h3>{{ request.listing.title }}</h3>
    <p class="viewing__city">{{ request.listing.city }}</p>

    <p *ngIf="ownerMode && request.requester" class="viewing__person">
      <i class="pi pi-user"></i>{{ request.requester.name }} {{ request.requester.surname || '' }}
    </p>
    <p *ngIf="!ownerMode && request.owner" class="viewing__person">
      <i class="pi pi-user"></i>{{ request.owner.name }} {{ request.owner.surname || '' }}
    </p>

    <p class="viewing__date">
      <i class="pi pi-calendar"></i>{{ request.requestedDate | date:'medium' }}
    </p>
    <p *ngIf="request.note" class="viewing__note">{{ request.note }}</p>
  </div>

  <div class="viewing__side">
    <span class="ra-pill"
          [class.ra-pill--success]="request.status === 'APPROVED'"
          [class.viewing__status--danger]="request.status === 'REJECTED' || request.status === 'CANCELLED'">
      {{ request.status }}
    </span>

    <ng-container *ngIf="ownerMode && request.status === 'PENDING'">
      <button type="button" class="ra-btn ra-btn--sm viewing__approve" (click)="approve()">
        Approve
      </button>
      <button type="button" class="ra-btn ra-btn--sm viewing__reject" (click)="reject()">
        Reject
      </button>
    </ng-container>

    <button *ngIf="!ownerMode && (request.status === 'PENDING' || request.status === 'APPROVED')"
            type="button" class="ra-btn ra-btn--ghost ra-btn--sm" (click)="cancel()">
      Cancel
    </button>
  </div>
</article>
