<section>
  <h2>Verification</h2>
  <p class="profile__sub">Verified accounts are trusted faster and appear higher in owner inboxes.</p>

  <div class="verify">
    <div class="verify__bar">
      <div class="verify__fill" [style.width.%]="progress"></div>
    </div>
    <p>{{ progress }}% complete</p>
  </div>

  <ul class="verify__list">
    <li *ngFor="let s of steps" [class.done]="s.status === 'verified'" [class.pending]="s.status === 'pending'">
      <i class="pi" [ngClass]="s.status === 'verified' ? 'pi-check-circle' : s.status === 'pending' ? 'pi-clock' : 'pi-circle'"></i>
      <span>{{ s.label }}</span>
      <span class="verify__status" *ngIf="s.status === 'verified'">Verified</span>
      <span class="verify__status verify__status--pending" *ngIf="s.status === 'pending'">Pending</span>
      <button type="button"
              class="ra-btn ra-btn--sm ra-btn--ghost"
              *ngIf="s.status !== 'verified'"
              [disabled]="sending"
              (click)="verificationRequested.emit()">
        <i *ngIf="sending" class="pi pi-spin pi-spinner"></i>
        {{ s.status === 'pending' ? 'Resend' : 'Verify' }}
      </button>
    </li>
  </ul>

  <form class="verify-code"
        *ngIf="requested || pending"
        (ngSubmit)="verificationConfirmed.emit()">
    <label class="field">
      <span>Email verification code</span>
      <input class="ra-input"
             [ngModel]="code"
             (ngModelChange)="codeChange.emit($event)"
             name="verificationCode"
             inputmode="numeric"
             autocomplete="one-time-code"
             placeholder="123456" />
    </label>
    <button type="submit"
            class="ra-btn"
            [disabled]="confirming || !code.trim()">
      <i *ngIf="confirming" class="pi pi-spin pi-spinner"></i>
      Confirm email
    </button>
  </form>
</section>
