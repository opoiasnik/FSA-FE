<section class="profile">
  <app-profile-header
    [user]="user()"
    [avatarUrl]="avatarUrl()"
    [memberSince]="memberSince()"
    [uploading]="uploading()"
    (fileSelected)="uploadFile($event)">
  </app-profile-header>

  <div class="profile__layout">
    <app-profile-tabs [tabs]="tabs" [active]="tab()" (activeChange)="switch($event)"></app-profile-tabs>

    <div class="ra-card profile__panel">
      <ng-container [ngSwitch]="tab()">

        <app-profile-personal-form
          *ngSwitchCase="'profile'"
          [form]="form"
          [saving]="saving()"
          [dirty]="isDirty"
          (saved)="saveProfile()">
        </app-profile-personal-form>

        <app-profile-verification-panel
          *ngSwitchCase="'verification'"
          [progress]="verificationProgress()"
          [steps]="verificationSteps()"
          [code]="verificationCode()"
          [requested]="emailVerificationRequested()"
          [pending]="emailVerificationPending()"
          [sending]="sendingEmailCode()"
          [confirming]="confirmingEmailCode()"
          (codeChange)="verificationCode.set($event)"
          (verificationRequested)="requestEmailVerification()"
          (verificationConfirmed)="confirmEmailVerification()">
        </app-profile-verification-panel>

        <app-profile-notifications-panel
          *ngSwitchCase="'notifications'"
          [notifications]="visibleNotifications()"
          [saving]="savingNotificationPreferences()"
          (toggled)="toggleNotificationPreference($event)">
        </app-profile-notifications-panel>

      </ng-container>
    </div>
  </div>
</section>
