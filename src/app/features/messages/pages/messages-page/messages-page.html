<section class="inbox">
  <p-message *ngIf="error()" severity="warn" [text]="error() || ''"></p-message>

  <div class="inbox__grid"
       [class.inbox__grid--empty]="!selected()"
       *ngIf="!loading()">
    <app-message-thread-list
      [threads]="threads()"
      [selectedId]="selectedId()"
      [avatarUrls]="peerAvatarUrls()"
      (selected)="select($event)">
    </app-message-thread-list>

    <app-message-conversation
      [conversation]="selected()"
      [avatarUrls]="peerAvatarUrls()"
      [sending]="sending()"
      (sent)="send($event)">
    </app-message-conversation>

    <app-message-listing-preview
      [listing]="selectedListing()"
      [photoUrl]="selectedListingPhotoUrl()"
      (opened)="openListing($event)">
    </app-message-listing-preview>
  </div>
</section>
