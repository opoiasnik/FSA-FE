<app-auth-layout
  eyebrow="Welcome back"
  title="Sign in to RentArea"
  prompt="New here?"
  linkText="Create an account"
  linkTo="/register"
  artImage="modern-houses.jpg"
  artImageSize="cover">

  <app-auth-form
    mode="login"
    [form]="form"
    [loading]="loading()"
    [error]="error()"
    (submitted)="onSubmit()">
  </app-auth-form>

  <section auth-art class="auth-art__content">
    <span class="ra-pill ra-pill--accent">Explore listings</span>
    <h2>Sign in to discover your next home.</h2>
    <p>Browse hundreds of verified rental properties, save favourites, and book viewings — all in one place.</p>
  </section>
</app-auth-layout>
