<app-auth-layout
  eyebrow="Join Rental"
  title="Create your account"
  prompt="Already have an account?"
  linkText="Sign in"
  linkTo="/login"
  artImage="smart-home-1200x800.avif">

  <ng-container *ngIf="success(); else formTpl">
    <div class="auth-success">
      <i class="pi pi-check-circle"></i>
      <h2>Account created!</h2>
      <p>Redirecting you to the home page…</p>
    </div>
  </ng-container>

  <ng-template #formTpl>
    <app-auth-form
      mode="register"
      [form]="form"
      [loading]="loading()"
      [error]="error()"
      (submitted)="onSubmit()">
    </app-auth-form>
  </ng-template>

  <section auth-art class="auth-art__content">
    <span class="ra-pill ra-pill--accent">Get started</span>
    <h2>Your perfect home is just a few clicks away.</h2>
    <p>Create an account to browse listings, save favourites, and request viewings instantly.</p>
  </section>
</app-auth-layout>
