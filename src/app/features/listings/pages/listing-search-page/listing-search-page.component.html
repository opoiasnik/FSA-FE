<section class="search">

  <app-search-pill [showFilters]="true" (search)="onPillSearch($event)"></app-search-pill>

  <app-listing-filter-bar (search)="onFiltersSearch($event)"></app-listing-filter-bar>

  <div class="results-head">
    <div>
      <h1>{{ cityLabel() }} · properties</h1>
      <p>{{ totalElements() }} properties · updated just now</p>
    </div>
    <label class="sort">
      Sort by
      <select class="ra-input"
              [ngModel]="sortBy()"
              (ngModelChange)="sortBy.set($any($event) || null); load()"
              [ngModelOptions]="{standalone: true}">
        <option [ngValue]="null">Most relevant</option>
        <option *ngFor="let opt of sortOptions" [value]="opt.value">{{ opt.label }}</option>
      </select>
    </label>
  </div>

  <p-message *ngIf="error()" severity="warn" [text]="error() || ''"></p-message>

  <div *ngIf="loading()" class="skeleton-grid">
    <p-skeleton *ngFor="let _ of [1,2,3,4,5,6]" width="100%" height="220px"></p-skeleton>
  </div>

  <div *ngIf="!loading()" class="split">
    <div class="split__list">
      <app-listing-card
        *ngFor="let item of listings()"
        [listing]="item"
        [saved]="isSaved(item.id)"
        (cardClick)="openDetail(item.id)"
        (mouseenter)="selectedId.set(item.id)"
        (mouseleave)="selectedId.set(null)"
        (saveToggle)="toggleSave(item.id)">
      </app-listing-card>

      <div *ngIf="!listings().length" class="no-results">
        No listings match your filters. Try widening the search.
      </div>
    </div>

    <aside class="split__map">
      <app-map-view [pins]="mapPins()" [selectedId]="selectedId()"
                    (pinSelect)="selectedId.set($event); openDetail($event)">
      </app-map-view>
    </aside>
  </div>

</section>
