<section class="wizard">
  <div class="wizard__head">
    <div>
      <div class="ra-eyebrow">Owner studio</div>
      <h1>{{ pageTitle() }}</h1>
    </div>
  </div>

  <app-listing-wizard-stepper
    [steps]="steps"
    [currentStep]="currentStep()"
    [completedStepIds]="completedStepIds()"
    [invalidStepIds]="invalidStepIds()"
    (stepSelected)="goTo($event)">
  </app-listing-wizard-stepper>

  <div class="ra-card wizard__panel">
    <h2>{{ activeStep().title }}</h2>
    <p class="wizard__sub">{{ activeStep().sub }}</p>

    <form [formGroup]="form" class="wizard__form" novalidate>
      <app-listing-basics-step *ngIf="activeStep().id === 'basics'" [form]="form"></app-listing-basics-step>

      <app-listing-location-step *ngIf="activeStep().id === 'location'" [form]="form"></app-listing-location-step>

      <app-listing-details-step
        *ngIf="activeStep().id === 'details'"
        [form]="form"
        [maxYearBuilt]="maxYearBuilt">
      </app-listing-details-step>

      <app-listing-price-step *ngIf="activeStep().id === 'price'" [form]="form"></app-listing-price-step>

      <app-listing-photo-uploader
        *ngIf="activeStep().id === 'media'"
        [previews]="allPhotoPreviews()"
        [readonlyCount]="existingPhotoPreviews().length"
        [error]="mediaError()"
        (filesSelected)="addPhotos($event)"
        (photoRemoved)="removePhoto($event)">
      </app-listing-photo-uploader>

      <app-listing-review-step
        *ngIf="activeStep().id === 'review'"
        [form]="form"
        [photoPreviews]="allPhotoPreviews()">
      </app-listing-review-step>
    </form>

    <p-message *ngIf="createError()" severity="error" [text]="createError() || ''"></p-message>

    <div class="wizard__nav">
      <button type="button" class="ra-btn ra-btn--ghost" (click)="prev()" [disabled]="currentStep() === 0">
        <i class="pi pi-arrow-left"></i>Back
      </button>
      <button type="button" class="ra-btn" (click)="next()" [disabled]="creating() || !canProceedSig()">
        {{ isLastStep() ? submitLabel() : 'Continue' }}<i class="pi pi-arrow-right"></i>
      </button>
    </div>
  </div>
</section>
