<section class="detail">
  <nav class="breadcrumb">
    <a routerLink="/home">Home</a>
    <i class="pi pi-angle-right"></i>
    <a routerLink="/listings">Listings</a>
    <i class="pi pi-angle-right"></i>
    <span *ngIf="listing() as item">For {{ item.listingType === 'RENT' ? 'rent' : 'sale' }}</span>
  </nav>

  <p-message *ngIf="error()" severity="error" [text]="error() || ''"></p-message>

  <div *ngIf="loading()" class="skeleton-gallery">
    <p-skeleton width="100%" height="440px"></p-skeleton>
  </div>

  <ng-container *ngIf="listing() as item">
    <div class="layout">
      <div class="layout__main">
        <app-listing-gallery
          [listingId]="item.id"
          [title]="item.title"
          [photos]="item.photos ?? []"
          [imageUrls]="photoImageUrls()">
        </app-listing-gallery>

        <app-listing-detail-overview
          [listing]="item"
          [facts]="facts()"
          [amenities]="amenities"
          [address]="fullAddress()"
          [saved]="saved()"
          [ownListing]="isOwnListing()"
          (saveToggled)="toggleSave()"
          (shared)="shareListing()">
        </app-listing-detail-overview>
      </div>

      <app-listing-detail-sidebar
        *ngIf="owner() as own"
        [listingId]="item.id"
        [listingType]="item.listingType"
        [owner]="own"
        [priceAmount]="priceAmount()"
        [pricePerSqm]="pricePerSqm()"
        [views]="listingViews()"
        [canViewStats]="canViewListingStats()"
        [ownListing]="isOwnListing()"
        [canMessageOwner]="canMessageOwner()"
        [openingConversation]="openingConversation()"
        [canBookViewing]="canBookViewing()"
        [loadingViewingRequest]="loadingCurrentViewingRequest()"
        [currentViewingRequest]="currentViewingRequest()"
        [viewingSuccess]="viewingSuccess()"
        (messagesOpened)="openMessages()"
        (viewingOpened)="openViewingForm()">
      </app-listing-detail-sidebar>

      <app-listing-location-section
        class="layout__location"
        [listingId]="item.id"
        [mapPins]="mapPin()"
        [address]="fullAddress()">
      </app-listing-location-section>
    </div>
  </ng-container>
</section>

<app-listing-viewing-dialog
  [visible]="viewingForm()"
  [date]="viewingDate()"
  [note]="viewingNote()"
  [minDate]="today"
  [error]="viewingError()"
  [submitting]="creatingViewing()"
  (closed)="cancelViewingForm()"
  (dateChange)="setViewingDate($event)"
  (noteChange)="setViewingNote($event)"
  (submitted)="submitViewing()">
</app-listing-viewing-dialog>
