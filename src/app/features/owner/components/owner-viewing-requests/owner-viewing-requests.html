<section class="ra-card dash__viewings" aria-label="Viewing requests">
  <header class="dash__viewings-head">
    <h2>Viewing requests</h2>
    <span>{{ requests.length }} total</span>
  </header>

  <ul>
    <li *ngFor="let v of requests">
      <div>
        <strong>{{ v.requester?.name || 'User' }}</strong>
        <p>{{ v.listing.title }} · {{ v.requestedDate | date:'medium' }}</p>
        <p *ngIf="v.note" class="dash__note">{{ v.note }}</p>
      </div>
      <div class="dash__viewing-actions">
        <span class="ra-pill"
              [class.ra-pill--success]="v.status === 'APPROVED'"
              [class.ra-pill--danger]="v.status === 'REJECTED' || v.status === 'CANCELLED'">
          {{ v.status }}
        </span>
        <ng-container *ngIf="v.status === 'PENDING'">
          <button type="button" class="ra-btn ra-btn--sm" (click)="approved.emit(v.id)">Approve</button>
          <button type="button" class="ra-btn ra-btn--ghost ra-btn--sm" (click)="rejected.emit(v.id)">Reject</button>
        </ng-container>
      </div>
    </li>
    <li *ngIf="!requests.length" class="dash__empty">No viewing requests yet.</li>
  </ul>
</section>
