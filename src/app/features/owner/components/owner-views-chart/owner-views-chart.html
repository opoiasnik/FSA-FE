<section class="ra-card dash__chart" aria-label="Views in the last 30 days">
  <header class="dash__chart-head">
    <h2>Views - last 30 days</h2>
    <span>{{ total }} total</span>
  </header>

  <div class="dash__chart-body">
    <div class="dash__chart-yaxis" *ngIf="chart.hasData">
      <span>{{ chart.yMax }}</span>
      <span>{{ chart.yMid }}</span>
      <span>0</span>
    </div>

    <div class="dash__chart-area"
         (mousemove)="onChartMove($event)"
         (mouseleave)="onChartLeave()">

      <div *ngIf="hoveredPoint()" class="dash__chart-tooltip"
           [style.left.%]="hoveredPoint()!.pct * 100"
           [style.transform]="tooltipTransform(hoveredPoint()!.pct)">
        <strong>{{ hoveredPoint()!.views }}</strong>
        <span>{{ hoveredPoint()!.date }}</span>
      </div>

      <svg class="dash__chart-svg" viewBox="0 0 300 80" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="ownerChartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.01"/>
          </linearGradient>
        </defs>
        <line *ngFor="let gy of chart.gridY"
              x1="0" x2="300"
              [attr.y1]="gy" [attr.y2]="gy"
              stroke="var(--border)" stroke-width="0.5"/>
        <ng-container *ngIf="chart.hasData">
          <path [attr.d]="chart.fillPath" fill="url(#ownerChartGrad)"/>
          <path [attr.d]="chart.linePath"
                fill="none" stroke="var(--accent)"
                stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </ng-container>
        <ng-container *ngIf="hoveredPoint()">
          <line [attr.x1]="hoveredPoint()!.svgX" [attr.x2]="hoveredPoint()!.svgX"
                y1="0" y2="80"
                stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
          <circle [attr.cx]="hoveredPoint()!.svgX" [attr.cy]="hoveredPoint()!.svgY"
                  r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
        </ng-container>
        <text *ngIf="!chart.hasData"
              x="150" y="44" text-anchor="middle"
              font-size="11" fill="var(--text-muted)">No views yet</text>
      </svg>

      <div class="dash__chart-xaxis" *ngIf="chart.hasData">
        <span *ngFor="let label of chart.xLabels">{{ label }}</span>
      </div>
    </div>
  </div>
</section>
