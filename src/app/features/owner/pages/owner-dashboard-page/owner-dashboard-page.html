<section class="dash">
  <header class="dash__head">
    <div>
      <div class="ra-eyebrow">Owner studio</div>
      <h1>Your properties at a glance</h1>
      <p>Live performance across your active and draft listings.</p>
    </div>
    <button type="button" class="ra-btn" (click)="createListing()">
      <i class="pi pi-plus"></i>Publish a listing
    </button>
  </header>

  <p-message *ngIf="error()" severity="warn" [text]="error() || ''"></p-message>

  <app-owner-stat-grid [cards]="statCards()"></app-owner-stat-grid>

  <div class="dash__row">
    <app-owner-views-chart [trend]="stats()?.viewsTrend"></app-owner-views-chart>
    <app-owner-viewing-requests
      [requests]="viewingRequests()"
      (approved)="approveViewing($event)"
      (rejected)="rejectViewing($event)">
    </app-owner-viewing-requests>
  </div>

  <app-owner-listings-table
    [listings]="listings()"
    [loading]="loading()"
    [canActivateListing]="canActivateListing()"
    [canDeactivateListing]="canDeactivateListing()"
    [canDeleteListing]="canDeleteListing()"
    (exported)="exportCsv()"
    (opened)="openListing($event)"
    (edited)="editListing($event)"
    (statusToggled)="toggleListingStatus($event)"
    (deleted)="deleteListing($event)">
  </app-owner-listings-table>
</section>
